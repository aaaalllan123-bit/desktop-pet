<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; img-src 'self' file: data:; media-src 'self' file: blob:; style-src 'self' 'unsafe-inline'">
  <title>Desktop Pet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="bubble"></div>
    <div id="fx"></div>
    <div id="pet" data-mode="idle">
      <div id="body">
        <img id="img" class="sprite" draggable="false" alt="">
        <video id="vid" class="sprite" muted loop playsinline hidden></video>
        <canvas id="cvs" class="sprite" hidden></canvas>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
